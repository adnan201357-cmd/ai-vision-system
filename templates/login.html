<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AI Vision System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <select onchange="setLanguage(this.value)" style="padding:6px; margin-bottom:15px;">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="ms">Malay</option>
    </select>

    <h1 data-i18n="loginTitle">🔐 Login</h1>
    <p data-i18n="loginDesc">Authorized users only</p>

    <div class="card">
        <input type="text" id="username" class="input" data-i18n-placeholder="username" />
        <input type="password" id="password" class="input" data-i18n-placeholder="password" />

        <button class="btn" onclick="login()" data-i18n="loginBtn">Login</button>

        <p id="error" style="color:red; margin-top:10px;"></p>
    </div>
</div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
